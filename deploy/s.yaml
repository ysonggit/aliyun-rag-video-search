# Serverless Devs Configuration (s.yaml)
# Deploy both FC functions + API Gateway in one command
#
# Usage:
#   s deploy
#   s deploy --trigger-http-only  (deploy only query service)

edition: 3.0.0
name: rag-video-search
access: default

vars:
  region: ap-southeast-1
  service: rag-video-search
  dashscope_key: ${env(DASHSCOPE_API_KEY)}
  dashvector_key: ${env(DASHVECTOR_API_KEY)}
  dashvector_endpoint: ${env(DASHVECTOR_ENDPOINT)}

resources:
  # ── Query Service ──────────────────────────────────────
  query_service:
    component: fc3
    props:
      region: ${vars.region}
      functionName: query-service
      runtime: custom-container
      cpu: 1
      memorySize: 2048
      diskSize: 512
      timeout: 60
      instanceConcurrency: 10
      customContainerConfig:
        image: ${env(ACR_REGISTRY)}/rag-query:latest
        port: 9000
      environmentVariables:
        DASHSCOPE_API_KEY: ${vars.dashscope_key}
        DASHSCOPE_BASE_URL: https://dashscope-intl.aliyuncs.com/api/v1
        DASHVECTOR_API_KEY: ${vars.dashvector_key}
        DASHVECTOR_ENDPOINT: ${vars.dashvector_endpoint}
        DV_COLLECTION_NAME: scene_frames
        EMBEDDING_MODEL: tongyi-embedding-vision-plus
        # Shared secret that the API Gateway injects as X-Internal-Token.
        # If set, /search refuses any request missing/mismatching the header.
        # Defense-in-depth against direct hits to this FC URL.
        INTERNAL_TOKEN: ${env(INTERNAL_TOKEN)}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            methods: [GET, POST]
            # Stays anonymous at FC level — API Gateway is the real auth layer.
            # The INTERNAL_TOKEN header check in code blocks direct URL abuse.
            authType: anonymous

  # ── Web UI (Streamlit) ─────────────────────────────────
  # Public-facing search UI. Sits behind API Gateway + WAF in production.
  # Embeds pipeline.retriever directly (does not call query-service over HTTP),
  # so it needs the same DashScope/DashVector creds.
  web_ui:
    component: fc3
    props:
      region: ${vars.region}
      functionName: web-ui
      runtime: custom-container
      cpu: 1
      memorySize: 2048
      diskSize: 512
      timeout: 60
      instanceConcurrency: 10
      customContainerConfig:
        image: ${env(ACR_REGISTRY)}/rag-webui:latest
        port: 9000
      environmentVariables:
        DASHSCOPE_API_KEY: ${vars.dashscope_key}
        DASHSCOPE_BASE_URL: https://dashscope-intl.aliyuncs.com/api/v1
        DASHVECTOR_API_KEY: ${vars.dashvector_key}
        DASHVECTOR_ENDPOINT: ${vars.dashvector_endpoint}
        DV_COLLECTION_NAME: scene_frames
        EMBEDDING_MODEL: tongyi-embedding-vision-plus
        # Session-scoped password gate rendered by app.py.
        # If unset, the UI is open (dev only). Set a strong random string in prod.
        WEBUI_PASSWORD: ${env(WEBUI_PASSWORD)}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            methods: [GET, POST]
            authType: anonymous

  # ── Ingest Pipeline ────────────────────────────────────
  ingest_pipeline:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ingest-pipeline
      runtime: custom-container
      cpu: 2
      memorySize: 4096
      diskSize: 10240
      timeout: 900
      instanceConcurrency: 1
      customContainerConfig:
        image: ${env(ACR_REGISTRY)}/rag-ingest:v2
        port: 9000
      environmentVariables:
        DASHSCOPE_API_KEY: ${vars.dashscope_key}
        DASHSCOPE_BASE_URL: https://dashscope-intl.aliyuncs.com/api/v1
        DASHVECTOR_API_KEY: ${vars.dashvector_key}
        DASHVECTOR_ENDPOINT: ${vars.dashvector_endpoint}
        DV_COLLECTION_NAME: scene_frames
        EMBEDDING_MODEL: tongyi-embedding-vision-plus
        VL_MODEL: qwen-vl-max
        OSS_ENDPOINT: ${env(OSS_ENDPOINT)}
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
        OSS_BUCKET_NAME: ${env(OSS_BUCKET_NAME)}
      # OSS trigger added manually via FC console after deployment
      # See deploy/README.md Step 3 for instructions
      triggers: []

  # ── Custom Domain (optional) ───────────────────────────
  # custom_domain:
  #   component: fc3_domain
