<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
  <defs>
    <marker id="ap-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="ap-up" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <filter id="ap-shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1000" height="560" fill="#fafafa"/>
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Ingestion Pipeline — Concurrent Stages + Checkpoint</text>
  <text x="500" y="61" text-anchor="middle" font-size="13" fill="#64748b">Overlapping embed/caption · parallel OSS upload · resumable runs</text>

  <!-- 1. Video source -->
  <rect x="40" y="200" width="135" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="107" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Video source</text>
  <text x="107" y="249" text-anchor="middle" font-size="10.5" fill="#64748b">OSS raw-videos/</text>
  <text x="107" y="263" text-anchor="middle" font-size="10.5" fill="#64748b">or local .MP4</text>

  <!-- 2. Extract -->
  <rect x="215" y="200" width="140" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="285" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">FrameExtractor</text>
  <text x="285" y="249" text-anchor="middle" font-size="10.5" fill="#64748b">OpenCV</text>
  <text x="285" y="263" text-anchor="middle" font-size="10.5" fill="#64748b">fixed interval</text>

  <!-- 3. Concurrent container -->
  <rect x="395" y="150" width="205" height="180" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="497" y="172" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">concurrent · overlap</text>
  <rect x="410" y="184" width="175" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="497" y="208" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Embedder pool</text>
  <text x="497" y="226" text-anchor="middle" font-size="10" fill="#15803d">≤8/batch · EMBED_WORKERS</text>
  <rect x="410" y="252" width="175" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="497" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Captioner pool</text>
  <text x="497" y="294" text-anchor="middle" font-size="10" fill="#15803d">Qwen-VL · CAPTION_WORKERS</text>

  <!-- 4. Upload pool -->
  <rect x="640" y="200" width="140" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="710" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">OSS upload pool</text>
  <text x="710" y="249" text-anchor="middle" font-size="10.5" fill="#15803d">parallel</text>
  <text x="710" y="263" text-anchor="middle" font-size="10.5" fill="#15803d">UPLOAD_WORKERS</text>

  <!-- 5. Index -->
  <rect x="820" y="200" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="895" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Indexer → DashVector</text>
  <text x="895" y="249" text-anchor="middle" font-size="10.5" fill="#64748b">batched upsert</text>
  <text x="895" y="263" text-anchor="middle" font-size="10.5" fill="#64748b">(cosine)</text>

  <!-- flow arrows -->
  <line x1="175" y1="235" x2="210" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ap-gray)"/>
  <line x1="355" y1="235" x2="390" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ap-gray)"/>
  <line x1="600" y1="235" x2="635" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ap-gray)"/>
  <line x1="780" y1="235" x2="815" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ap-gray)"/>

  <!-- Checkpoint manifest -->
  <rect x="215" y="410" width="565" height="64" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#ap-shadow)"/>
  <text x="497" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Checkpoint manifest — storage/manifests/&#123;collection&#125;.txt</text>
  <text x="497" y="458" text-anchor="middle" font-size="10.5" fill="#6d28d9">indexed frame_ids appended per upsert batch · skipped on re-run (resume, no API re-spend)</text>

  <!-- manifest leaders (point up into the lane) -->
  <line x1="285" y1="410" x2="285" y2="274" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ap-up)"/>
  <line x1="710" y1="410" x2="710" y2="274" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ap-up)"/>

  <!-- legend -->
  <rect x="40" y="505" width="16" height="16" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="64" y="518" font-size="12" fill="#475569">parallelized stage</text>
  <rect x="220" y="505" width="16" height="16" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="244" y="518" font-size="12" fill="#475569">resume / checkpoint (new)</text>
  <rect x="440" y="505" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="464" y="518" font-size="12" fill="#475569">unchanged stage</text>
</svg>
